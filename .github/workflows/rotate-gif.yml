name: Rotate profile GIF

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-gif-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Rotate to the next GIF
        run: python3 scripts/rotate_gif.py

      - name: Commit the changed GIF as Aditya
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHOR_NAME: ADITYA PUNJANI
          AUTHOR_EMAIL: 217623281+ADITYADEV4145@users.noreply.github.com
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add README.md
          if git diff --cached --quiet -- README.md; then
            echo "No GIF change; nothing to commit."
            exit 0
          fi
          git commit -m "Rotate profile GIF" -- README.md
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
